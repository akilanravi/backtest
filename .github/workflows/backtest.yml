name: CPR combinatorial 5-minute backtest
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1-5'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python backtest.py --config config.json --universe universe.csv --output results
      - name: Upload complete CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-combinations-and-trades
          path: results/
          retention-days: 30
