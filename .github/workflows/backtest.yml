name: CPR combinatorial 5-minute backtest
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1-5'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Show repository structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | head -70
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate backtest engine (always)
        run: |
          python -m py_compile backtest.py
          python - <<'PY'
          import backtest
          assert 'ST7' in backtest.EXIT_VARIANTS
          print('Backtest engine imports correctly; exit variants:', len(backtest.EXIT_VARIANTS))
          PY
      - name: Run unit tests if uploaded
        run: |
          if [ -f tests/test_engine.py ]; then
            python -m pytest -q tests/test_engine.py
          else
            echo 'NOTICE: tests/test_engine.py was not uploaded. Engine smoke check passed; continuing to actual backtest.'
          fi
      - name: Run real backtest
        run: python backtest.py --config config.json --universe universe.csv --output results
      - name: Upload complete CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-combinations-and-trades
          path: results/*.csv
          if-no-files-found: warn
          retention-days: 30
