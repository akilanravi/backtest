name: CPR Dhan 5Y combinatorial research
on:
  workflow_dispatch:
    inputs:
      max_stocks:
        description: '0=all 50 stocks; 3 for quick API smoke test'
        required: false
        default: '0'
  # Manual only: a 5-year scan of 50 stocks is computationally intensive.
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check code and unit tests
        run: |
          python -m py_compile backtest.py
          python -m pytest -q tests/test_engine.py tests/test_dhan.py
      - name: Download Dhan data and run backtest
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          MAX_STOCKS: ${{ inputs.max_stocks }}
        run: |
          test -n "$DHAN_ACCESS_TOKEN" || (echo 'Missing DHAN_ACCESS_TOKEN secret' && exit 1)
          python backtest.py --config config.json --universe universe.csv --output results --max-stocks "${MAX_STOCKS:-0}"
      - name: Upload CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhan-cpr-5year-results
          path: results/*.csv
          if-no-files-found: warn
          retention-days: 30
